# Docker DNS: адреса API и агента могут меняться после пересоздания контейнеров.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream application_api {
    zone application_api 64k;
    server api:8000 resolve;
}

upstream readonly_agent {
    zone readonly_agent 64k;
    server agent:8000 resolve;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/agent/ {
        proxy_pass http://readonly_agent;
        proxy_read_timeout 120s;
    }
    location /api/ {
        proxy_pass http://application_api;
        proxy_read_timeout 120s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
