name: interview-fullstack
services:
  source-mock:
    build: .
    command: ["uv", "run", "--frozen", "--no-dev", "uvicorn", "source.fixture:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${SOURCE_PORT:-8093}:8000"
    healthcheck:
      test: ["CMD", "uv", "run", "--no-dev", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8000"
    environment:
      DATABASE_URL: postgresql://importer:${IMPORTER_PASSWORD:?Run python3 scripts/setup_local.py}@postgres:5432/reporting
      SOURCE_BASE_URL: http://source-mock:8000
      ONEC_BASE_URL: ${ONEC_BASE_URL:-}
      ONEC_USER: ${ONEC_USER:-}
      ONEC_PASSWORD: ${ONEC_PASSWORD:-}
      ONEC_ACCOUNTS_PATH: ${ONEC_ACCOUNTS_PATH:-accounts}
      ONEC_CHARGES_PATH: ${ONEC_CHARGES_PATH:-charges}
      ONEC_PAYMENTS_PATH: ${ONEC_PAYMENTS_PATH:-payments}
    depends_on:
      source-mock:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "--no-dev", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  agent:
    build:
      context: .
      target: agent
    command: ["uv", "run", "--frozen", "--no-dev", "uvicorn", "source.agent.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${AGENT_PORT:-8081}:8000"
    environment:
      AGENT_DATABASE_URL: postgresql://agent_reader:demo-reader-local@postgres:5432/reporting
      LLM_API: ${LLM_API:-}
      SOURCE_BASE_URL: http://source-mock:8000
      ONEC_BASE_URL: ${ONEC_BASE_URL:-}
      ONEC_USER: ${ONEC_USER:-}
      ONEC_PASSWORD: ${ONEC_PASSWORD:-}
      ONEC_ACCOUNTS_PATH: ${ONEC_ACCOUNTS_PATH:-accounts}
      ONEC_CHARGES_PATH: ${ONEC_CHARGES_PATH:-charges}
      ONEC_PAYMENTS_PATH: ${ONEC_PAYMENTS_PATH:-payments}
    depends_on:
      source-mock:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "--no-dev", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
      agent:
        condition: service_healthy
  postgres:
    image: postgres:17.4-bookworm@sha256:304ab813518754228f9f792f79d6da36359b82d8ecf418096c636725f8c930ad
    environment:
      POSTGRES_DB: reporting
      POSTGRES_USER: importer
      POSTGRES_PASSWORD: ${IMPORTER_PASSWORD:?Run python3 scripts/setup_local.py}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5543}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U importer -d reporting"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
